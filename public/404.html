<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сторінку не знайдено — Техкарта</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;600;800&family=IBM+Plex+Mono:wght@500&family=Pangolin&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
.nf{min-height:100svh;display:grid;place-items:center;text-align:center;padding:48px var(--gutter)}
.nf__num{font:800 clamp(120px,24vw,280px)/.8 var(--font);letter-spacing:-.06em;color:var(--text)}
.nf .tape{rotate:-3deg;margin-top:28px}
.nf p{margin:28px auto 32px;max-width:420px;color:var(--muted)}
</style>
</head>
<body>
<main class="nf">
  <div>
    <a class="logo" href="/" aria-label="Техкарта — на головну"><span class="logo__dot" aria-hidden="true">т</span><b>техкарта</b></a>
    <p class="nf__num" style="margin:40px 0 0;color:var(--text)">404</p>
    <span class="tape"><small>страва</small>не знайдена</span>
    <p>Такої сторінки немає в нашій техкарті. Поверніться на головну — там усе по порядку.</p>
    <a class="btn btn--cta" href="/">На головну</a>
  </div>
</main>
</body>
</html>
